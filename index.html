<title>Mr. Mendez — Teaching Dashboard</title>

<style>
:root{
  --ground:#F7F6F3; --surface:#FFFFFF; --sunk:#EFEDE8;
  --ink:#16202C; --body:#33404F; --muted:#6B7889; --line:#DEDBD4;
  --im1:#2F6F8F; --im1-soft:#E4EEF3;
  --fa:#3F6B52; --fa-soft:#E3EDE7;
  --now:#C8791A; --now-soft:#FBEEDC;
  --alert:#A33B2A; --alert-soft:#F8E5E1;
  --shadow:0 1px 2px rgba(22,32,44,.06),0 4px 16px rgba(22,32,44,.05);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#111820; --surface:#1A2430; --sunk:#151E28;
    --ink:#EEF2F6; --body:#C2CCD8; --muted:#8494A6; --line:#2B3846;
    --im1:#6FB4D4; --im1-soft:#1C3340;
    --fa:#7FBE9B; --fa-soft:#1B3227;
    --now:#E9A44E; --now-soft:#3A2A14;
    --alert:#E8836F; --alert-soft:#3A1F1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#111820; --surface:#1A2430; --sunk:#151E28;
  --ink:#EEF2F6; --body:#C2CCD8; --muted:#8494A6; --line:#2B3846;
  --im1:#6FB4D4; --im1-soft:#1C3340;
  --fa:#7FBE9B; --fa-soft:#1B3227;
  --now:#E9A44E; --now-soft:#3A2A14;
  --alert:#E8836F; --alert-soft:#3A1F1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
:root[data-theme="light"]{
  --ground:#F7F6F3; --surface:#FFFFFF; --sunk:#EFEDE8;
  --ink:#16202C; --body:#33404F; --muted:#6B7889; --line:#DEDBD4;
  --im1:#2F6F8F; --im1-soft:#E4EEF3;
  --fa:#3F6B52; --fa-soft:#E3EDE7;
  --now:#C8791A; --now-soft:#FBEEDC;
  --alert:#A33B2A; --alert-soft:#F8E5E1;
  --shadow:0 1px 2px rgba(22,32,44,.06),0 4px 16px rgba(22,32,44,.05);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-text-size-adjust:100%;padding-bottom:80px}
h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40}
.top .wrap{display:flex;align-items:center;gap:12px;
  padding-top:12px;padding-bottom:12px}
.brand{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.brand span{display:block;font:500 11px/1.3 var(--mono);color:var(--muted);
  letter-spacing:.09em;text-transform:uppercase}
.spring{flex:1}
.iconbtn{background:var(--sunk);border:1px solid var(--line);color:var(--body);
  width:38px;height:38px;border-radius:9px;font-size:15px;cursor:pointer;
  display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn:focus-visible{outline:2px solid var(--now);outline-offset:2px}

/* ---------- now bar ---------- */
.nowbar{background:var(--now-soft);border-bottom:1px solid var(--line)}
.nowbar .wrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding-top:9px;padding-bottom:9px}
.nowbar .clock{font:700 14px/1 var(--mono);color:var(--now);
  font-variant-numeric:tabular-nums}
.nowbar .msg{font-size:13.5px;color:var(--ink);font-weight:600}
.nowbar .sub{font-size:13px;color:var(--muted)}

/* ---------- tabs ---------- */
.tabs{background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:63px;z-index:35}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding:0 16px;
  scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:none;border-bottom:2.5px solid transparent;
  color:var(--muted);font:600 13.5px/1 var(--sans);padding:13px 12px;
  cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--now)}
.tab:focus-visible{outline:2px solid var(--now);outline-offset:-3px}

/* ---------- day header ---------- */
.dayhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;
  padding:22px 0 4px}
.dayhead h2{font-size:22px;letter-spacing:-.02em;line-height:1.2}
.dayhead .d{font:500 12.5px/1.4 var(--mono);color:var(--muted);
  letter-spacing:.05em;text-transform:uppercase}
.navbtns{display:flex;gap:6px;margin-left:auto}
.navbtns button{background:var(--surface);border:1px solid var(--line);
  color:var(--body);border-radius:8px;padding:6px 11px;font-size:13px;
  cursor:pointer;font-family:var(--sans)}
.navbtns button:hover{border-color:var(--muted)}
.navbtns button:focus-visible{outline:2px solid var(--now);outline-offset:2px}

/* ---------- banners ---------- */
.banner{border-radius:var(--r);padding:12px 14px;margin:14px 0;
  font-size:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.banner b{color:var(--ink)}
.banner.warn{background:var(--now-soft);border:1px solid var(--now)}
.banner.crit{background:var(--alert-soft);border:1px solid var(--alert)}
.banner .ic{font:700 12px/1.5 var(--mono);flex:none}

/* ---------- period cards ---------- */
.cards{display:flex;flex-direction:column;gap:12px;margin:16px 0 30px}
.card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card.im1{border-left:4px solid var(--im1)}
.card.fa{border-left:4px solid var(--fa)}
.card.iscur{border-color:var(--now);box-shadow:0 0 0 2px var(--now-soft),var(--shadow)}
.card.free{border-left:4px solid var(--line);opacity:.75}

.chead{display:flex;align-items:center;gap:12px;padding:14px 16px;
  cursor:pointer;width:100%;background:none;border:none;text-align:left;
  font-family:var(--sans)}
.chead:focus-visible{outline:2px solid var(--now);outline-offset:-3px}
.pnum{font:700 19px/1 var(--mono);color:var(--muted);
  font-variant-numeric:tabular-nums;flex:none;width:22px}
.card.im1 .pnum{color:var(--im1)} .card.fa .pnum{color:var(--fa)}
.cmid{flex:1;min-width:0}
.ctime{font:600 12px/1.4 var(--mono);color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ctitle{font-size:15.5px;font-weight:650;color:var(--ink);line-height:1.35;
  margin-top:2px}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.chev{color:var(--muted);font-size:12px;transition:transform .18s}
.card.open .chev{transform:rotate(180deg)}

.pill{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;padding:5px 7px;border-radius:5px;white-space:nowrap}
.pill.im1{background:var(--im1-soft);color:var(--im1)}
.pill.fa{background:var(--fa-soft);color:var(--fa)}
.pill.now{background:var(--now);color:#fff}
.pill.must{background:var(--now-soft);color:var(--now)}
.pill.gh{background:var(--sunk);color:var(--muted)}

/* ---------- taught status ---------- */
.srow{display:flex;gap:6px;align-items:center;padding:0 16px 13px;flex-wrap:wrap}
.slab{font:700 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-right:2px}
.sbtn{background:var(--sunk);border:1px solid var(--line);color:var(--muted);
  border-radius:20px;padding:6px 12px;font:650 12px/1 var(--sans);cursor:pointer}
.sbtn:hover{border-color:var(--muted);color:var(--ink)}
.sbtn:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.sbtn[aria-pressed="true"].on{background:var(--fa);border-color:var(--fa);color:#fff}
.sbtn[aria-pressed="true"].long{background:var(--now);border-color:var(--now);color:#fff}
.sbtn[aria-pressed="true"].no{background:var(--alert);border-color:var(--alert);color:#fff}

.drift{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--now);
  border-radius:var(--r);padding:13px 15px;margin:14px 0;box-shadow:var(--shadow)}
.drift h3{font-size:14px;margin-bottom:2px}
.drift .dsub{font-size:13px;color:var(--muted);line-height:1.5}
.drift ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.drift li{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
.drift .dp{font:700 11px/1.5 var(--mono);color:var(--muted);flex:none;width:52px}
.drift .dv{font-weight:650;color:var(--now)}
.drift .dv.ok{color:var(--fa)}

.cbody{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.card.open .cbody{display:block}
.goal{font-size:14.5px;color:var(--body);margin:14px 0;padding-left:12px;
  border-left:2px solid var(--line);font-style:italic}

.seclab{font:700 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 9px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.flow li{display:flex;gap:11px;font-size:14px;line-height:1.5}
.flow .mm{font:700 11.5px/1.6 var(--mono);color:var(--ink);background:var(--sunk);
  border-radius:5px;padding:1px 6px;height:fit-content;flex:none;min-width:38px;
  text-align:center;font-variant-numeric:tabular-nums}
.flow .ft{color:var(--ink);font-weight:650}
.flow .fd{color:var(--body);display:block;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sunk);border-radius:6px;padding:5px 9px;font-size:12.5px;
  color:var(--body);overflow-wrap:anywhere;min-width:0;max-width:100%}
a.lnk{color:var(--im1);text-decoration:underline;text-underline-offset:2px;font-weight:600;overflow-wrap:anywhere}
a.lnk:hover{text-decoration-thickness:2px}
.note{background:var(--sunk);border-radius:9px;padding:11px 13px;font-size:13.5px;
  line-height:1.5;margin-top:8px}
.note.hot{background:var(--alert-soft);color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--line)}
.act{background:var(--sunk);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font:600 12.5px/1 var(--sans);color:var(--body);cursor:pointer}
.act:hover{border-color:var(--muted);color:var(--ink)}
.act:focus-visible{outline:2px solid var(--now);outline-offset:2px}

/* ---------- week ---------- */
.wk{display:flex;flex-direction:column;gap:10px;margin:16px 0 30px}
.wkday{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.wkday.today{border-color:var(--now);box-shadow:0 0 0 2px var(--now-soft),var(--shadow)}
.wkday h3{font-size:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wkday .dt{font:500 11.5px/1 var(--mono);color:var(--muted);letter-spacing:.05em;
  text-transform:uppercase}
.wkrow{display:flex;gap:10px;font-size:13.5px;padding:7px 0;
  border-top:1px solid var(--line);margin-top:8px;line-height:1.45}
.wkrow:first-of-type{margin-top:10px}
.wkrow .tag{font:700 10px/1.5 var(--mono);letter-spacing:.06em;flex:none;width:34px}
.wkrow.im1 .tag{color:var(--im1)} .wkrow.fa .tag{color:var(--fa)}

/* ---------- semester ---------- */
.togg{display:flex;gap:6px;margin:16px 0 12px}
.togg button{flex:1;background:var(--surface);border:1px solid var(--line);
  color:var(--muted);border-radius:9px;padding:10px;font:650 13.5px/1 var(--sans);
  cursor:pointer}
.togg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);
  border-color:var(--ink)}
.togg button:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.pace{display:flex;flex-direction:column;gap:7px;margin-bottom:30px}
.pw{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;display:flex;gap:13px;align-items:flex-start}
.pw.cur{border-color:var(--now);background:var(--now-soft)}
.pw .w{font:700 11px/1.5 var(--mono);color:var(--muted);flex:none;width:46px;
  letter-spacing:.04em}
.pw .u{font-size:13.5px;color:var(--ink);line-height:1.45}
.pw .dd{font:500 11px/1.5 var(--mono);color:var(--muted);display:block}
.pw .nt{font-size:12.5px;color:var(--now);font-weight:600;display:block;margin-top:3px}

/* ---------- prep ---------- */
.prep{display:flex;flex-direction:column;gap:8px;margin:16px 0 30px}
.pitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.pitem.crit{border-left:4px solid var(--alert)}
.pitem.done{opacity:.5}
.pitem.done .ptext{text-decoration:line-through}
.box{width:19px;height:19px;border:2px solid var(--muted);border-radius:5px;
  flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;
  color:transparent}
.pitem.done .box{background:var(--fa);border-color:var(--fa);color:#fff}
.ptext{font-size:14px;color:var(--ink);line-height:1.45}
.pfor{font:500 11px/1.5 var(--mono);color:var(--muted);display:block;
  letter-spacing:.04em;text-transform:uppercase}

.qs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:30px}
.qs ul{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.6}
.qs li{margin-bottom:6px}

.foot{font-size:12.5px;color:var(--muted);text-align:center;padding:10px 0 24px;
  line-height:1.6}
.hide{display:none!important}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:9px;
  font-size:13.5px;font-weight:600;z-index:100;opacity:0;
  transition:transform .25s,opacity .25s;pointer-events:none;max-width:90vw}
#toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
@media print{
  @page{margin:1.4cm}
  body{background:#fff;color:#000;padding:0;font-size:11.5pt}
  .top,.tabs,.nowbar,.navbtns,.acts,.togg,#toast,.iconbtn{display:none!important}
  .wrap{max-width:none;padding:0}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #bbb;
    border-left-width:3px;margin-bottom:10pt}
  .cbody{display:block!important}
  .chev{display:none}
  .wkday,.pw,.pitem,.qs{break-inside:avoid;box-shadow:none;border:1px solid #bbb}
  .note,.chip,.flow .mm{background:#f2f2f2}
  a{text-decoration:none;color:#000}
  a.lnk{font-weight:400}
  .printonly{display:block!important}
  .printhide{display:none!important}
}
.printonly{display:none}
</style>

<div class="wrap">

  if(u.endsWith(")")&&!u.includes("(")){u=u.slice(0,-1);t=")"+t}
  return`<a class="lnk" href="${u}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${u}</a>${t}`});
const dayRec=k=>DATA.days.find(d=>d.date===k);
/* the Mon–Fri week that contains CUR (the day being viewed) */
function weekOf(k){const d=parse(k),m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));
  const f=new Date(m);f.setDate(m.getDate()+4);return[iso(m),iso(f),m,f]}
function weekLabel(k){const[, ,m,f]=weekOf(k);
  return m.getMonth()===f.getMonth()?`${MON[m.getMonth()]} ${m.getDate()} – ${f.getDate()}, ${f.getFullYear()}`
    :`${MON[m.getMonth()]} ${m.getDate()} – ${MON[f.getMonth()]} ${f.getDate()}, ${f.getFullYear()}`}
function weekDays(k){const[a,b]=weekOf(k);return DATA.days.filter(d=>d.date>=a&&d.date<=b)}
/* pacing week number: week 1 starts Mon Aug 3, 2026 */
function paceWeek(){return Math.floor((parse(iso(new Date()))-new Date(2026,7,3))/(7*86400000))+1}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------------- staleness guard ---------------- */
/* Tells Mario when what he's reading is older than the plans on his drive,
   instead of letting him find out mid-lesson. */
function buildAgeDays(){
  /* tolerate a suffix like "2026-08-09b" — a past session shipped one and it silently
     turned the age into NaN, which disabled the staleness banner entirely. */
  const b=String(BUILT).slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(b))return 0;
  return Math.floor((parse(iso(new Date()))-parse(b))/86400000)}
function staleBlock(){
  const age=buildAgeDays();
  if(age<7)return"";
  return`<div class="banner crit printhide"><span class="ic">!</span><div>
    <b>This page was last rebuilt ${age} days ago.</b> Your plans may have changed since.
    Ask Claude to republish the dashboard before you rely on what's below.</div></div>`}
function builtLine(){
  const d=parse(String(BUILT).slice(0,10)),age=buildAgeDays();
  const when=`${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  const how=age<=0?"today":age===1?"yesterday":`${age} days ago`;
  return`Last rebuilt ${when} (${how}).`}

/* ---------------- taught status ---------------- */
/* One tap per period. Three states, no notes field — on purpose.
   Cost per day: about 3 seconds. Payoff in June: a pacing calendar that reflects
   what actually happened, which becomes next year's accurate calendar. */
const SKEY="taughtStatus";
const allStatus=()=>JSON.parse(localStorage.getItem(SKEY)||"{}");
const getStatus=(d,p)=>allStatus()[d+"|"+p]||null;
function setStatus(d,p,v){
  const a=allStatus(),k=d+"|"+p;
  if(a[k]===v)delete a[k]; else a[k]=v;      /* tapping the same one again clears it */
  localStorage.setItem(SKEY,JSON.stringify(a));
  /* keep whatever the teacher had open, and don't jump the scroll */
  const open=$$("#v-today .card.open").map(c=>c.id);
  const y=window.scrollY;
  renderToday();
  open.forEach(id=>{const c=document.getElementById(id);
    if(c){c.classList.add("open");
      const b=c.querySelector(".chead");if(b)b.setAttribute("aria-expanded","true")}});
  window.scrollTo(0,y)}

/* Drift is tracked PER PERIOD, not per course — your two IM1 sections genuinely
   do drift apart, and that's worth catching. ran long = half a day, didn't happen = a full day. */
function drift(){
  const a=allStatus(),out={1:0,2:0,3:0,4:0};
  Object.entries(a).forEach(([k,v])=>{
    const p=k.split("|")[1];
    if(out[p]===undefined)return;
    if(v==="long")out[p]+=0.5; else if(v==="no")out[p]+=1});
  return out}

function driftBlock(){
  const d=drift(),any=Object.values(d).some(v=>v>0);
  if(!any)return"";
  const fmt=v=>v===0?"on plan":v===0.5?"half a day behind":v===1?"1 day behind":`${v} days behind`;
  let h=`<div class="drift printhide"><h3>Pacing check</h3>
    <div class="dsub">Based on what you've tapped. Sections drift apart — that's normal, but worth seeing.</div><ul>`;
  [1,2,3,4].forEach(p=>{
    const c=DATA.assign[p],v=d[p];
    h+=`<li><span class="dp">P${p} ${c}</span><span class="dv${v===0?" ok":""}">${fmt(v)}</span></li>`});
  h+=`</ul></div>`;
  return h}

function statusRow(date,p){
  const cur=getStatus(date,p);
  const b=(v,cls,label)=>`<button class="sbtn ${cls}" aria-pressed="${cur===v}"
    onclick="setStatus('${date}',${p},'${v}')">${label}</button>`;
  return`<div class="srow printhide"><span class="slab">Taught?</span>
    ${b("on","on","On plan")}${b("long","long","Ran long")}${b("no","no","Didn't happen")}</div>`}

/* pick which day to show: today if it has a plan, else the next planned day */
function pickDay(){const t=iso(new Date());
  if(dayRec(t))return t;
  const nxt=DATA.days.find(d=>d.date>=t);
  return nxt?nxt.date:DATA.days[DATA.days.length-1].date}
let CUR=pickDay();

/* ---------------- now bar ---------------- */
function tickNow(){
  const n=new Date(),today=iso(n),cur=n.getHours()*60+n.getMinutes();
  $("#clock").textContent=t12(`${pad(n.getHours())}:${pad(n.getMinutes())}`);
  const rec=dayRec(today);
  if(!rec){
    const nxt=DATA.days.find(d=>d.date>=today);
    $("#nowmsg").textContent=nxt?`No class today`:`No plans loaded`;
    $("#nowsub").textContent=nxt?`Next planned day: ${DOW[parse(nxt.date).getDay()]}, ${MON[parse(nxt.date).getMonth()]} ${parse(nxt.date).getDate()}`:"";
    return}
  const bells=DATA.bells[rec.type];
  const inNow=bells.find(b=>cur>=mins(b.start)&&cur<mins(b.end));
  if(inNow){
    const left=mins(inNow.end)-cur;
    if(inNow.p==="lunch"){$("#nowmsg").textContent="Lunch";$("#nowsub").textContent=`${left} min left`}
    else{const c=DATA.assign[inNow.p];
      const L=rec.lessons&&rec.lessons[inNow.p]?DATA.lessons[rec.lessons[inNow.p]]:null;
      $("#nowmsg").textContent=`Period ${inNow.p} · ${c==="PREP"?"Prep":c==="SUPPORT"?"Support":c}`;
      $("#nowsub").textContent=(L?L.title+" · ":"")+`${left} min left`}
  }else{
    const next=bells.find(b=>mins(b.start)>cur);
    if(next){const to=mins(next.start)-cur;
      $("#nowmsg").textContent=next.p==="lunch"?"Lunch next":`Period ${next.p} next`;
      $("#nowsub").textContent=`starts in ${to} min · ${t12(next.start)}`}
    else{$("#nowmsg").textContent="Day's done";$("#nowsub").textContent="Go home."}}
}

function fb(t,m){const a=document.createElement("textarea");a.value=t;
  a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();
  try{document.execCommand("copy");toast(m)}catch(e){toast("Couldn't copy — select manually")}
  document.body.removeChild(a)}

function makeICS(){
  const dt=(dstr,t)=>{const[y,m,d]=dstr.split("-");const[h,mi]=t.split(":");
    return`${y}${m}${d}T${h}${mi}00`};
  let L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mendez//Teaching Dashboard//EN","CALSCALE:GREGORIAN"];
  DATA.days.forEach(rec=>{
    DATA.bells[rec.type].filter(b=>b.p!=="lunch"&&b.p<=4).forEach(b=>{
      const lid=rec.lessons[b.p];if(!lid)return;const les=DATA.lessons[lid];
      const desc=(les.goal+" || "+les.flow.map(f=>`${f.m}m ${f.t}`).join(" / ")).replace(/[,;\\]/g,"\\$&");
      L.push("BEGIN:VEVENT",`UID:${rec.date}-p${b.p}@mendez`,`DTSTAMP:${dt(rec.date,b.start)}`,
        `DTSTART:${dt(rec.date,b.start)}`,`DTEND:${dt(rec.date,b.end)}`,
        `SUMMARY:P${b.p} ${les.course} — ${les.title.replace(/[,;\\]/g,"\\$&")}`,
        `DESCRIPTION:${desc}`,"END:VEVENT")})});
  DATA.keyDates.forEach(k=>{
    const nd=k.date.replace(/-/g,"");
    L.push("BEGIN:VEVENT",`UID:key-${nd}@mendez`,`DTSTAMP:${nd}T000000`,
      `DTSTART;VALUE=DATE:${nd}`,`SUMMARY:${k.label.replace(/[,;\\]/g,"\\$&")}`,"END:VEVENT")});
  L.push("END:VCALENDAR");
  const blob=new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="mendez-teaching.ics";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);document.body.removeChild(a)},1200);
  toast("Calendar file downloaded")}

/* ---------------- tabs + theme ---------------- */
$$(".tab").forEach(t=>t.addEventListener("click",()=>{
  $$(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  ["today","week","sem","prep","notes"].forEach(v=>$("#v-"+v).classList.toggle("hide",v!==t.dataset.v));
  window.scrollTo(0,0)}));

$("#themebtn").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const sysDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  const now=cur?cur:(sysDark?"dark":"light");
  document.documentElement.setAttribute("data-theme",now==="dark"?"light":"dark")});
